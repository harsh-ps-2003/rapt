[project]
name = "rapt"
version = "0.1.0"
description = "Colour-coded prompt saliency debugger for AI engineers"
authors = [{ name = "Harsh Pratap Singh" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0",
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[project.scripts]
rapt = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
